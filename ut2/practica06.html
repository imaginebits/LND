<!--Has leído a Ángel González? Es un poeta sorprendente. Haz
una página con su poema “Eso era amor”. Respeta el formato, agrega el título al
comienzo. Al final de la página y justificado a la derecha coloca el nombre del
autor.
Le comenté:
- Me entusiasman tus ojos.
Y ella dijo:
        - ¿Te gustan solos o con rímel?
- Grandes,
        respondí sin dudar.
Y también sin dudar
me los dejó en un plato y se fue a tientas.

-->
<body>
  <H1>Eso era amor</H1>
  <PRE>
    Le comenté:<br>
    - Me entusiasman tus ojos.<br>
    Y ella dijo:<br>
        ¿Te gustan solos o con rímel?<br>
    - Grandes,<br>
        respondí sin dudar.<br>
    Y también sin dudar<br>
    me los dejó en un plato y se fue a tientas.
  </PRE> 
  
  
  <p align="right"><b>Ángel González</b></p>
</body>
</html>
