<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRACTICA 29</title>
</head>
<body>
<FORM>
    <TABLE style="background-color: rgb(206, 206, 206);">
        <TR>
            <TD>
                <B>INTERESES:</B>
                <HR>

                <!-- 1era fila oculta -->
                <INPUT type="hidden" name="IES" value="Pérez Minik">

                <!-- 2da fila de campos contraseña y texto -->
                CONTRASEÑA DE PERFIL:
                <INPUT type="password" name="password" size="15"><BR>
                CURSO:
                <INPUT type="text" name="curso" size="25" maxlength="30"><BR>

                <!-- 3era fila interereses -->
                INTERESES:<BR>
                <INPUT type="checkbox" name="informatica" checked>Informática
                <INPUT type="checkbox" name="deportes">Deportes
                <INPUT type="checkbox" name="salud" checked>Salud
                <BR>
                <INPUT type="checkbox" name="politica">Política
                <INPUT type="checkbox" name="musica" checked>Música
                <INPUT type="checkbox" name="literatura">literatura

                <HR>

                <!--4ra fila color -->
                Color favorito:<BR>
                <INPUT type="radio" name="color" value="rojo" checked>ROJO
                <INPUT type="radio" name="color" value="verde">VERDE
                <INPUT type="radio" name="color" value="azul">AZUL
                <BR>
                <INPUT type="radio" name="estacion" value="verano">VERANO
                <INPUT type="radio" name="estacion" value="otono">OTOÑO
                <INPUT type="radio" name="estacion" value="invierno" checked>INVIERNO
                <INPUT type="radio" name="estacion" value="primavera">PRIMAVERA
                <!--5ra fila color aceptar o borrAR -->
                <HR>
                <INPUT type="submit" value="Aceptar">
                <INPUT type="reset" value="Borrar">
            </TD>
        </TR>
    </TABLE>
</FORM>

</body>
</html>
