<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table border="2px" style="background-color: rgb(239, 239, 239);">
        <tr>
            <td><b>INTERESES</b>
                <Form>
                    <br>
                    <!--Cammpo oculto-->
                    <INPUT TYPE="hidden" name=”nombre” checked>
                    <!--Cammpo para rellenar-->
                    CONTRASEÑA DEL PERFIL:
                    <INPUT TYPE="password" name=”nombre” checked><br>
                    CURSO:
                    <INPUT TYPE="text" name="nombre" value="Intruduzca su curso actual" size="39" 
                    maxlength="20"><br>
                    <!--Selección de intereses con desplegable-->
                    INTERESES:
                    <SELECT name=”Aeropuertos” size=”6” >
                        <OPTGROUP>
                            <OPTION VALUE=”01” selected>Mascotas
                            <OPTION VALUE=”02” selected>Informática
                            <OPTION VALUE=”03” selected>Literatura
                            <OPTION VALUE=”04” selected>Salud
                            <OPTION VALUE=”05” selected>Politica
                            </OPTGROUP>
                        </OPTGROUP>
                    </SELECT>
                    <br>
                    

                    <!--Selección de color con desplegable-->
                    <hr>
                    Color favorito: <br>
                    <SELECT name=”Aeropuertos” size=”6” >
                        <OPTGROUP>
                            <OPTION VALUE=”01” selected>Rojo
                            <OPTION VALUE=”02” selected>Verde
                            <OPTION VALUE=”03” selected>Negro
                            <OPTION VALUE=”04” selected>Azul
                            <OPTION VALUE=”05” selected>Blanco
                            </OPTGROUP>
                        </OPTGROUP>
                    </SELECT>
                    <br>
                    
                    <hr>
                    <INPUT TYPE="submit" value="ACEPTAR"> 
            <INPUT TYPE="reset" value="RESET">
                </Form>
            </td>
        </tr>

    </table>
</body>
</html>
